name: Package operator build

# Binary-only operator package (no Python/JS source). Manual run = build + smoke
# + downloadable artifact. A v* tag also publishes a GitHub Release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    # Pre-merge validation: workflow_dispatch only works once this file is on main.
    branches: ["feature/k2b-binary-packaging"]

permissions:
  contents: write

jobs:
  windows-nuitka:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Fail on LFS pointer stubs in data dirs
        shell: bash
        run: |
          stubs=$(grep -rl "^version https://git-lfs" games/source games/source_group games/audio 2>/dev/null | head -5 || true)
          if [ -n "$stubs" ]; then echo "LFS pointers not resolved:"; echo "$stubs"; exit 1; fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build (Nuitka)
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_RUN_NUMBER)" }
          powershell -File packaging\build_nuitka_windows.ps1 -Tag $tag

      - name: Gate - no source in package
        shell: pwsh
        run: |
          $stage = Get-ChildItem dist\release -Directory | Select-Object -First 1
          $bad = Get-ChildItem $stage.FullName -Recurse -Include *.py,*.pyc,*.sqlite
          if ($bad) { $bad | Select-Object -First 20 FullName; throw "forbidden files in package" }

      - name: Smoke - simulator stack comes up from the frozen exe
        shell: pwsh
        run: |
          $stage = (Get-ChildItem dist\release -Directory | Select-Object -First 1).FullName
          $exe = Join-Path $stage "LED Hoops.exe"
          & $exe --selftest | Tee-Object selftest.txt
          $p = Start-Process -FilePath $exe -ArgumentList "--sim","--no-browser" -PassThru
          $ok = $false
          foreach ($i in 1..45) {
            Start-Sleep 2
            try { if ((Invoke-WebRequest http://127.0.0.1:8000/ -UseBasicParsing -TimeoutSec 2).StatusCode -eq 200) { $ok = $true; break } } catch {}
          }
          if (-not $ok) { Get-Content "$stage\logs\*.log" -ErrorAction SilentlyContinue | Select-Object -Last 80; throw "UI/API did not come up" }
          $pl = Invoke-RestMethod http://127.0.0.1:8000/playlists
          if ($pl.single.Count -lt 1) { throw "playlists empty" }
          $hw = Invoke-RestMethod http://127.0.0.1:8000/hw-debug
          Write-Host "hw-debug: $($hw | ConvertTo-Json -Compress)"
          $br = Invoke-WebRequest http://127.0.0.1:8765/docs -UseBasicParsing -TimeoutSec 5
          & $exe --stop

      # Informational (continue-on-error): results are printed in the log. These
      # exercise the Windows-only behaviours that need no hardware.
      - name: Check - hardware flag default (no serial device)
        continue-on-error: true
        shell: pwsh
        run: |
          $stage = (Get-ChildItem dist\release -Directory | Select-Object -First 1).FullName
          $exe = Join-Path $stage "LED Hoops.exe"
          Start-Process -FilePath $exe -ArgumentList "--no-browser" -PassThru | Out-Null
          $ok = $false
          foreach ($i in 1..45) { Start-Sleep 2; try { if ((Invoke-WebRequest http://127.0.0.1:8000/ -UseBasicParsing -TimeoutSec 2).StatusCode -eq 200) { $ok = $true; break } } catch {} }
          Write-Host "RESULT api_up_in_hardware_mode=$ok"
          if ($ok) {
            $hw = Invoke-RestMethod http://127.0.0.1:8000/hw-debug
            Write-Host "RESULT use_serial_hd_default=$($hw.use_serial_hd)"
          }
          Write-Host "--- api.console.log tail"; Get-Content "$stage\logs\api.console.log" -Tail 25 -ErrorAction SilentlyContinue
          Write-Host "--- supervisor.log"; Get-Content "$stage\logs\supervisor.log" -ErrorAction SilentlyContinue
          & $exe --stop
          Start-Sleep 3
          $up = $false; try { Invoke-WebRequest http://127.0.0.1:8000/ -UseBasicParsing -TimeoutSec 2 | Out-Null; $up = $true } catch {}
          Write-Host "RESULT stop_freed_port=$(-not $up)"

      - name: Check - kiosk, Ctrl+Shift+K hotkey, STOP
        continue-on-error: true
        shell: pwsh
        run: |
          $stage = (Get-ChildItem dist\release -Directory | Select-Object -First 1).FullName
          $exe = Join-Path $stage "LED Hoops.exe"
          function Kiosk { Get-CimInstance Win32_Process -Filter "Name='msedge.exe' OR Name='chrome.exe'" | Where-Object { $_.CommandLine -like "*ActiverseKiosk*hoops*" } }
          function Up { try { (Invoke-WebRequest http://127.0.0.1:8000/ -UseBasicParsing -TimeoutSec 2).StatusCode } catch { 0 } }
          Start-Process -FilePath $exe -ArgumentList "--sim" | Out-Null
          $ok = $false
          foreach ($i in 1..45) { Start-Sleep 2; if ((Up) -eq 200) { $ok = $true; break } }
          Write-Host "RESULT api_up=$ok"
          Start-Sleep 10
          $k = @(Kiosk)
          Write-Host "RESULT kiosk_running_with_profile=$($k.Count -gt 0) procs=$($k.Count)"
          $vis = Get-Process | Where-Object { $_.ProcessName -like "LED Hoops*" -and $_.MainWindowHandle -ne 0 }
          Write-Host "RESULT no_visible_exe_window=$(-not $vis)"
          Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          public class Kb { [DllImport("user32.dll")] public static extern void keybd_event(byte vk, byte scan, uint flags, UIntPtr extra); }
          "@
          [Kb]::keybd_event(0x11,0,0,[UIntPtr]::Zero); [Kb]::keybd_event(0x10,0,0,[UIntPtr]::Zero); [Kb]::keybd_event(0x4B,0,0,[UIntPtr]::Zero)
          Start-Sleep -Milliseconds 150
          [Kb]::keybd_event(0x4B,0,2,[UIntPtr]::Zero); [Kb]::keybd_event(0x10,0,2,[UIntPtr]::Zero); [Kb]::keybd_event(0x11,0,2,[UIntPtr]::Zero)
          $gone = $false
          foreach ($i in 1..10) { Start-Sleep 1; if (-not (Kiosk)) { $gone = $true; break } }
          Write-Host "RESULT hotkey_closed_kiosk=$gone"
          Write-Host "RESULT game_alive_after_hotkey=$((Up) -ne 0)"
          cmd /c "`"$stage\STOP_GAME.bat`""
          Start-Sleep 4
          Write-Host "RESULT stop_bat_freed_ports=$((Up) -eq 0)"
          $left = @(Get-Process | Where-Object { $_.ProcessName -like "LED Hoops*" })
          Write-Host "RESULT no_leftover_processes=$($left.Count -eq 0)"
          Write-Host "--- supervisor.log"; Get-Content "$stage\logs\supervisor.log" -ErrorAction SilentlyContinue

      - name: Check - gameplay in the frozen exe
        continue-on-error: true
        shell: pwsh
        run: |
          $port = 8000
          $base = "http://127.0.0.1:$port"
          $stage = (Get-ChildItem dist\release -Directory | Select-Object -First 1).FullName
          $exe = Get-ChildItem $stage -Filter "*.exe" | Where-Object { $_.Name -like "LED *" } | Select-Object -First 1 -ExpandProperty FullName
          Start-Process -FilePath $exe -ArgumentList "--sim","--no-browser" | Out-Null
          $ok = $false
          foreach ($i in 1..45) { Start-Sleep 2; try { if ((Invoke-WebRequest "$base/" -UseBasicParsing -TimeoutSec 2).StatusCode -eq 200) { $ok = $true; break } } catch {} }
          Write-Host "RESULT gameplay_api_up=$ok"
          $pl = Invoke-RestMethod "$base/playlists"
          $level = $pl.single[0].id
          $body = @{ card_id = "guest"; level = "$level" } | ConvertTo-Json
          $r = Invoke-RestMethod -Method Post -Uri "$base/start-game" -ContentType "application/json" -Body $body
          Write-Host "RESULT start_game_success=$($r.success) level=$level error=$($r.error)"
          Start-Sleep 4
          $a = Invoke-RestMethod "$base/active-game"
          Write-Host "RESULT active_game_running=$($a.success) game_id=$($a.game_id)"
          # The game shows a countdown intro (clock reads 0) before play starts; wait it out.
          $s1 = $null
          foreach ($i in 1..40) { $s1 = Invoke-RestMethod "$base/game-state"; if ($s1.state.time_elapsed -gt 0) { break }; Start-Sleep 2 }
          Write-Host "RESULT left_countdown=$($s1.state.time_elapsed -gt 0) phase=$($s1.state.phase)"
          Start-Sleep 3
          $s2 = Invoke-RestMethod "$base/game-state"
          Write-Host "RESULT game_clock_advancing=$($s2.state.time_elapsed -gt $s1.state.time_elapsed) t1=$($s1.state.time_elapsed) t2=$($s2.state.time_elapsed)"
          Write-Host "RESULT led_frame_present=$(($null -ne $s2.state.led_display) -or ($null -ne $s2.state.wall_display))"
          Get-Content "$stage\logs\api.console.log" -Tail 40 -ErrorAction SilentlyContinue | Select-String -Pattern "Traceback|ERROR" | ForEach-Object { Write-Host "API-LOG $_" }
          & $exe --stop

      - uses: actions/upload-artifact@v4
        with:
          name: LED-Hoops-windows-nuitka
          path: dist/release/*.zip
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/release/*.zip
